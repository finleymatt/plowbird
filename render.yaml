# Render Blueprint: the Plowbird web app (plowbird.app) and API (api.plowbird.app).
# In Render: New → Blueprint → pick this repo. Docs: https://render.com/docs/blueprint-spec
services:
  # Node API: Express + Socket.IO + SQLite. The disk keeps the database across deploys,
  # which needs a paid instance (free instances have no disk and sleep when idle).
  - type: web
    name: plowbird-api
    runtime: node
    region: ohio
    plan: 0.5c-512mb
    rootDir: server
    buildCommand: npm ci
    # The seed only adds the demo accounts if they're missing, and only in demo mode.
    startCommand: npm run seed && npm start
    healthCheckPath: /health
    domains:
      - api.plowbird.app
    disk:
      name: plowbird-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/plow.db
      - key: JWT_SECRET
        generateValue: true
      - key: NWS_USER_AGENT
        value: Plowbird/1.0 (https://plowbird.app)
      # Lets drivers run a demo drive along the real route so tracking can be shown off.
      # Remove once real drivers are on the road.
      - key: DEMO_MODE
        value: "1"
      # Payments stay simulated until you add STRIPE_SECRET_KEY in the dashboard (see README).
      # Staff who can approve drivers and see /admin: comma-separated emails, set in the dashboard.
      - key: ADMIN_EMAILS
        sync: false
      # Pilot area: comma-separated ZIPs that can order (empty = everywhere) and how the site names
      # them, e.g. "Plymouth, Wayzata and Hopkins". Everyone else gets "coming soon" + the waitlist.
      - key: SERVICE_ZIPS
        sync: false
      - key: SERVICE_AREA_LABEL
        sync: false

  # Expo web build, served as a single-page app.
  - type: web
    name: plowbird-web
    runtime: static
    buildCommand: cd app && npm ci && npx expo export --platform web
    staticPublishPath: ./app/dist
    domains:
      - plowbird.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Bundles and assets have content hashes in their names, so phones can keep them for good.
    headers:
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_API_URL
        value: https://api.plowbird.app
